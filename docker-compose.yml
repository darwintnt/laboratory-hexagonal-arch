services:
  postgres:
    image: postgres:16-alpine
    container_name: hex-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=hex_pass
      - POSTGRES_DB=hex_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hex_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hex-network

volumes:
  postgres_data:

networks:
  hex-network:
    driver: bridge
